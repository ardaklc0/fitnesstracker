name: Migrate & Seed Database

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  migrate-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run seed
        run: npm run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
